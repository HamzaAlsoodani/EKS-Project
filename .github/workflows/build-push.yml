name: Build and Push to ECR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'js/**'
      - 'style/**'
      - 'meta/**'
      - 'index.html'
      - 'favicon.ico'
      - 'dockerfile'

permissions:
  id-token: write
  contents: write 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: app-2048
      AWS_REGION: eu-west-2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-session
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SHORT_SHA }} \
            -f dockerfile .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}
          format: table
          severity: CRITICAL
          exit-code: 1

      - name: Push to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      # ArgoCD deploys what is in Git, so write the new tag back to the manifest.
      - name: Update image tag in manifest
        run: |
          sed -i "s|\(image: .*/${{ env.ECR_REPOSITORY }}\):.*|\1:${{ env.SHORT_SHA }}|" k8s/deployment.yaml

          if ! git diff --quiet k8s/deployment.yaml; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git commit -am "Update image tag to ${{ env.SHORT_SHA }}"
            git push
          fi
